[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-framework"
version = "0.1.0"
description = "A modular framework for retrieval-augmented generation experimentation and evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "pydantic>=2.0,<3",
  "requests>=2.31",
  "rank-bm25>=0.2.2",
  "openai>=1.0",
  "httpx>=0.27",
  "tiktoken>=0.7",
]

[project.optional-dependencies]
models = [
  "torch>=2.1",
  "transformers>=4.40",
  "sentence-transformers>=3.0",
  "sentencepiece>=0.2",
  "accelerate>=0.30",
  "datasets>=2.19",
  "huggingface-hub>=0.23",
]
dev = ["pytest>=7.4"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["rag_benchmark*"]
namespaces = false
