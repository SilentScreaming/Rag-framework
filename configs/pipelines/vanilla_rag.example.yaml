name: vanilla_rag
method:
  family: vanilla_rag
  paper_reference: Lewis et al. 2020 is a reference point; this is a modern frozen-retriever implementation.
  project_implementation: Original question, one strong dense retriever, raw passages, and the shared generator.
  controlled_parent: closed_book
task_profile:
  track: short_answer
  answer_mode: short
  citations_required: false
  abstention_allowed: true
  max_answer_tokens: 64
budget:
  profile: quality_max
  max_context_tokens: 4096
  max_generation_tokens: 64
  max_queries: 1
  max_verification_questions: 1
  strict_components: true
stages:
  query_formulation: original_question
  retrieval: dense
  reranking: none
  compression: none
  generation: context_grounded
  verification: none
retrieval:
  model_ref: default_retrieval
  top_k: 10
  include_title: true
  search_backend: auto
generation:
  temperature: 0.0
  max_output_tokens: 64
